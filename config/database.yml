default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "catalog") %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: catalog_consolidation_development

test:
  <<: *default
  database: catalog_consolidation_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
